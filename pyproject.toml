[project]
name = "actathon"
version = "0.1.0"
description = "act-athon hackathon tooling: teleop, recording, pi0.5 training/eval on Modal, remote-inference control loop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lerobot[dataset]>=0.6.1",
    "modal>=1.5.5",
    "numpy>=2.2.6",
    "opencv-python>=5.0.0.93",
    "pi-sdk[inference,video]>=0.3.2",
    "pygame>=2.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/act"]

# PI's private registry (Google Artifact Registry). Auth: keyring + keyrings.google-artifactregistry-auth,
# with GOOGLE_APPLICATION_CREDENTIALS pointing at PI's service-account key (never commit the key).
# explicit = true: pi-sdk only ever comes from here, never from PyPI (PyPI's pi-sdk is a 0.0.2 placeholder).
[[tool.uv.index]]
name = "pi"
url = "<PI package registry URL from PI onboarding>"
explicit = true

[tool.uv.sources]
pi-sdk = { index = "pi" }

[tool.uv]
keyring-provider = "subprocess"
